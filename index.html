<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda Virtual - Factor E</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; transition: background 0.2s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://yeqwfmoixmbubvqfjjn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7NVCMxeslTFG_oFsHI3RVg_ptoFXfiQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORIES = [
      { id: 'operativo', label: 'Operativo', icon: '⚡', color: 'bg-blue-900', borderColor: 'border-blue-700', textColor: 'text-blue-300', pdf: [37, 99, 235] },
      { id: 'comercial', label: 'Comercial', icon: '📈', color: 'bg-green-900', borderColor: 'border-green-700', textColor: 'text-green-300', pdf: [22, 163, 74] },
      { id: 'estrategico', label: 'Estratégico', icon: '🧭', color: 'bg-purple-900', borderColor: 'border-purple-700', textColor: 'text-purple-300', pdf: [126, 34, 206] },
      { id: 'personal', label: 'Personal', icon: '🪴', color: 'bg-teal-900', borderColor: 'border-teal-700', textColor: 'text-teal-300', pdf: [13, 148, 136] }
    ];

    const PRIORITY_STYLE = {
      '1': { badge: 'bg-gradient-to-br from-yellow-300 to-yellow-600 text-yellow-950 border border-yellow-200', pdf: [217, 164, 6] },
      '2': { badge: 'bg-gradient-to-br from-slate-200 to-slate-400 text-slate-900 border border-slate-100', pdf: [148, 163, 184] },
      '3': { badge: 'bg-gradient-to-br from-amber-700 to-amber-900 text-amber-100 border border-amber-600', pdf: [146, 84, 33] }
    };

    const PRIORITY_WEIGHT = { '1': 5, '2': 3, '3': 1 };
    const PILAR_BONUS = 4;

    function emptyDay() {
      return {
        phrase: '',
        priorities: [{ text: '', done: false }, { text: '', done: false }, { text: '', done: false }],
        tasks: [],
        notes: [],
        timers: {},
        timerLog: []
      };
    }

    function emptyQuickAdd() {
      return Object.fromEntries(CATEGORIES.map(c => [c.id, { text: '', time: '', priority: '2', reminder: false }]));
    }

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
    }

    function getTheme(mode) {
      const dark = mode === 'dark';
      return {
        mode,
        bodyBg: dark ? '#1E293B' : '#F1F5F9',
        page: dark ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-900',
        card: dark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200',
        cardAlt: dark ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200',
        input: dark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400',
        heading: dark ? 'text-white' : 'text-slate-900',
        muted: dark ? 'text-slate-400' : 'text-slate-500',
        faint: dark ? 'text-slate-500' : 'text-slate-400',
        navBtn: dark ? 'bg-slate-800 hover:bg-slate-700 text-white border-slate-700' : 'bg-white hover:bg-slate-50 text-slate-900 border-slate-300',
        cellEmpty: dark ? 'bg-slate-900 border-slate-800 hover:border-slate-600' : 'bg-white border-slate-200 hover:border-slate-400',
        cellToday: dark ? 'bg-slate-700 border-2 border-slate-500' : 'bg-slate-200 border-2 border-slate-400'
      };
    }

    function MiDia() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedDate, setSelectedDate] = useState(new Date());
      const [data, setData] = useState({});
      const [themeMode, setThemeMode] = useState('dark');
      const [quickAdd, setQuickAdd] = useState(emptyQuickAdd());
      const [editingTask, setEditingTask] = useState(null);
      const [activeReminder, setActiveReminder] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setUser(session.user);
            loadUserData(session.user.id);
          }
          setAuthLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session) {
            setUser(session.user);
            loadUserData(session.user.id);
          } else {
            setUser(null);
            setData({});
          }
        });
        return () => subscription.unsubscribe();
      }, []);

      const loadUserData = async (userId) => {
        const { data: record, error } = await supabase
          .from('user_data')
          .select('agenda_data, theme')
          .eq('id', userId)
          .single();

        if (record) {
          setData(record.agenda_data || {});
          setThemeMode(record.theme || 'dark');
        } else if (error && error.code === 'PGRST116') {
          await supabase.from('user_data').insert([{ id: userId, agenda_data: {}, theme: 'dark' }]);
        }
      };

      const saveToSupabase = async (newData, newTheme) => {
        if (!user) return;
        setIsSaving(true);
        await supabase.from('user_data').upsert({
          id: user.id,
          email: user.email,
          agenda_data: newData || data,
          theme: newTheme || themeMode,
          updated_at: new Date().toISOString()
        });
        setIsSaving(false);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        const { data: authData, error } = await supabase.auth.signInWithPassword({
          email: email.trim(),
          password: password.trim()
        });
        if (error) setLoginError('Correo o contraseña incorrectos. Revisá los datos enviados por Factor E.');
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
      };

      const T = getTheme(themeMode);

      useEffect(() => {
        document.body.style.background = T.bodyBg;
      }, [themeMode]);

      const getDateKey = (date) => {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        return d.toISOString().split('T')[0];
      };
      const dateKey = getDateKey(selectedDate);
      const dayData = data[dateKey] || emptyDay();

      const updateDay = (updates, key = dateKey) => {
        const current = data[key] || emptyDay();
        const updated = { ...data, [key]: { ...current, ...updates } };
        setData(updated);
        saveToSupabase(updated, themeMode);
      };

      const updateQuickAdd = (catId, field, value) => {
        setQuickAdd(prev => ({ ...prev, [catId]: { ...prev[catId], [field]: value } }));
      };

      const addQuickTask = (catId) => {
        const qa = quickAdd[catId];
        if (!qa.text.trim()) return;
        const newTask = {
          id: Date.now(),
          text: qa.text.trim(),
          category: catId,
          time: qa.time,
          priority: qa.priority,
          reminder: qa.reminder,
          reminded: false,
          done: false
        };
        updateDay({ tasks: [...dayData.tasks, newTask] });
        setQuickAdd(prev => ({ ...prev, [catId]: { text: '', time: '', priority: qa.priority, reminder: false } }));
      };

      const deleteTask = (taskId) => {
        updateDay({ tasks: dayData.tasks.filter(t => t.id !== taskId) });
      };

      const toggleTask = (taskId) => {
        updateDay({ tasks: dayData.tasks.map(t => t.id === taskId ? { ...t, done: !t.done } : t) });
      };

      const toggleTaskReminder = (taskId) => {
        const task = dayData.tasks.find(t => t.id === taskId);
        if (!task) return;
        const newVal = !task.reminder;
        if (newVal && window.Notification && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        updateDay({ tasks: dayData.tasks.map(t => t.id === taskId ? { ...t, reminder: newVal, reminded: false } : t) });
      };

      const fireReminder = (task) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
        setActiveReminder(task);
      };

      useEffect(() => {
        const interval = setInterval(() => {
          const todayKey = getDateKey(new Date());
          const todayData = data[todayKey];
          if (!todayData || !todayData.tasks) return;
          const now = new Date();
          const nowStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
          const dueTask = todayData.tasks.find(t => t.reminder && !t.done && !t.reminded && t.time && t.time <= nowStr);
          if (dueTask) {
            fireReminder(dueTask);
            updateDay({
              tasks: todayData.tasks.map(t => t.id === dueTask.id ? { ...t, reminded: true } : t)
            }, todayKey);
          }
        }, 15000);
        return () => clearInterval(interval);
      }, [data]);

      const updatePriorityText = (idx, text) => {
        const priorities = dayData.priorities.map((p, i) => i === idx ? { ...p, text } : p);
        updateDay({ priorities });
      };

      const togglePriorityDone = (idx) => {
        const priorities = dayData.priorities.map((p, i) => i === idx ? { ...p, done: !p.done } : p);
        updateDay({ priorities });
      };

      const notes = dayData.notes || [];
      const [newNoteText, setNewNoteText] = useState('');

      const addNote = () => {
        if (!newNoteText.trim()) return;
        updateDay({ notes: [...notes, { id: Date.now(), text: newNoteText.trim(), done: false }] });
        setNewNoteText('');
      };

      const updateNoteText = (id, text) => {
        updateDay({ notes: notes.map(n => n.id === id ? { ...n, text } : n) });
      };

      const toggleNote = (id) => {
        updateDay({ notes: notes.map(n => n.id === id ? { ...n, done: !n.done } : n) });
      };

      const deleteNote = (id) => {
        updateDay({ notes: notes.filter(n => n.id !== id) });
      };

      const [, setTick] = useState(0);
      const timers = dayData.timers || {};
      const getTimer = (catId) => timers[catId] || { accumulated: 0, running: false, startedAt: null };
      const getElapsedSeconds = (catId) => {
        const t = getTimer(catId);
        return t.accumulated + (t.running ? (Date.now() - t.startedAt) / 1000 : 0);
      };

      const startTimer = (catId) => {
        const t = getTimer(catId);
        if (t.running) return;
        updateDay({ timers: { ...timers, [catId]: { ...t, running: true, startedAt: Date.now() } } });
      };

      const pauseTimer = (catId) => {
        const t = getTimer(catId);
        if (!t.running) return;
        const endedAt = Date.now();
        const sessionSeconds = (endedAt - t.startedAt) / 1000;
        const elapsed = t.accumulated + sessionSeconds;
        const logEntry = { id: Date.now(), category: catId, start: t.startedAt, end: endedAt, duration: Math.round(sessionSeconds) };
        updateDay({
          timers: { ...timers, [catId]: { accumulated: elapsed, running: false, startedAt: null } },
          timerLog: [...(dayData.timerLog || []), logEntry]
        });
      };

      const resetTimer = (catId) => {
        updateDay({ timers: { ...timers, [catId]: { accumulated: 0, running: false, startedAt: null } } });
      };

      useEffect(() => {
        const anyRunning = CATEGORIES.some(c => getTimer(c.id).running);
        if (!anyRunning) return;
        const id = setInterval(() => setTick(t => t + 1), 1000);
        return () => clearInterval(id);
      }, [data, dateKey]);

      const openEdit = (task) => setEditingTask({ ...task, _originalDate: dateKey, date: dateKey });

      const saveEdit = () => {
        if (!editingTask || !editingTask.text.trim()) return;
        const original = editingTask._originalDate;
        const newDate = editingTask.date;
        const cleanTask = {
          id: editingTask.id,
          text: editingTask.text.trim(),
          time: editingTask.time,
          category: editingTask.category,
          priority: editingTask.priority,
          reminder: editingTask.reminder,
          reminded: editingTask.reminder ? false : (editingTask.reminded || false),
          done: editingTask.done
        };
        if (newDate === original) {
          updateDay({ tasks: (data[original] || emptyDay()).tasks.map(t => t.id === cleanTask.id ? cleanTask : t) }, original);
        } else {
          updateDay({ tasks: (data[original] || emptyDay()).tasks.filter(t => t.id !== cleanTask.id) }, original);
          const targetDay = data[newDate] || emptyDay();
          updateDay({ tasks: [...targetDay.tasks, cleanTask] }, newDate);
        }
        setEditingTask(null);
      };

      const taskPoints = dayData.tasks.reduce((sum, t) => sum + PRIORITY_WEIGHT[t.priority], 0);
      const taskPointsDone = dayData.tasks.filter(t => t.done).reduce((sum, t) => sum + PRIORITY_WEIGHT[t.priority], 0);
      const activePriorities = dayData.priorities.filter(p => p.text.trim());
      const pilarPoints = activePriorities.length * PILAR_BONUS;
      const pilarPointsDone = activePriorities.filter(p => p.done).length * PILAR_BONUS;
      const totalPossible = taskPoints + pilarPoints;
      const totalDone = taskPointsDone + pilarPointsDone;
      const progressPercent = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0;

      const exportPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const pageW = doc.internal.pageSize.width;
        const pageH = doc.internal.pageSize.height;
        const marginX = 15;
        const contentW = pageW - marginX * 2;
        let y = 45;

        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, pageW, 32, 'F');
        doc.setFillColor(163, 230, 53);
        doc.rect(0, 32, pageW, 1.5, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.text('Mi Agenda Virtual', marginX, 18);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.setTextColor(203, 213, 225);
        doc.text(selectedDate.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }), marginX, 26);

        doc.setFontSize(14);
        doc.setTextColor(15, 23, 42);
        doc.text(`Avance total del día: ${progressPercent}%`, marginX, y);
        y += 10;

        doc.setFontSize(12);
        doc.text('Prioridades:', marginX, y);
        y += 7;
        activePriorities.forEach(p => {
          doc.text(`- [${p.done ? 'X' : ' '}] ${p.text}`, marginX + 5, y);
          y += 6;
        });

        doc.save(`agenda-${dateKey}.pdf`);
      };

      const year = selectedDate.getFullYear();
      const month = selectedDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const calendarDays = [];
      for (let i = 0; i < firstDay; i++) calendarDays.push(null);
      for (let i = 1; i <= daysInMonth; i++) calendarDays.push(i);

      if (authLoading) {
        return React.createElement('div', { className: 'min-h-screen bg-slate-950 flex items-center justify-center text-white text-sm' }, 'Cargando agenda...');
      }

      if (!user) {
        return React.createElement(
          'div', { className: 'min-h-screen bg-slate-950 flex items-center justify-center p-4' },
          React.createElement(
            'form', { onSubmit: handleLogin, className: 'bg-slate-900 border-2 border-slate-800 rounded-xl p-8 max-w-sm w-full' },
            React.createElement('div', { className: 'text-4xl mb-3 text-center' }, '🔒'),
            React.createElement('h1', { className: 'text-2xl font-black text-white text-center mb-1' }, 'Mi Agenda Virtual'),
            React.createElement('p', { className: 'text-xs text-slate-500 text-center mb-4' }, 'Factor E'),

            React.createElement('label', { className: 'text-xs text-slate-400 font-semibold' }, 'Correo electrónico'),
            React.createElement('input', {
              type: 'email', required: true, value: email, onChange: (e) => setEmail(e.target.value),
              placeholder: 'tu@correo.com',
              className: 'w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white mb-3 mt-1'
            }),

            React.createElement('label', { className: 'text-xs text-slate-400 font-semibold' }, 'Contraseña'),
            React.createElement('input', {
              type: 'password', required: true, value: password, onChange: (e) => setPassword(e.target.value),
              placeholder: '••••••••',
              className: 'w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white mb-4 mt-1'
            }),

            loginError && React.createElement('p', { className: 'text-xs text-red-400 mb-3' }, loginError),

            React.createElement('button', {
              type: 'submit',
              className: 'w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-bold text-white cursor-pointer'
            }, 'Ingresar')
          )
        );
      }

      return React.createElement(
        'div', { className: `min-h-screen ${T.page} p-4 md:p-8` },
        React.createElement(
          'div', { className: 'max-w-6xl mx-auto' },
          React.createElement(
            'div', { className: 'flex justify-between items-center mb-4 flex-wrap gap-2' },
            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('span', { className: `text-xs ${T.faint}` }, '👤 ' + user.email),
              isSaving && React.createElement('span', { className: 'text-[10px] text-green-400 animate-pulse' }, '• Guardando en la nube...')
            ),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('button', {
                onClick: () => {
                  const nextTheme = themeMode === 'dark' ? 'light' : 'dark';
                  setThemeMode(nextTheme);
                  saveToSupabase(data, nextTheme);
                },
                className: `px-3 py-1.5 rounded-lg border text-xs font-semibold ${T.navBtn}`
              }, themeMode === 'dark' ? '☀️ Claro' : '🌙 Oscuro'),
              React.createElement('button', { onClick: handleLogout, className: `px-3 py-1.5 rounded-lg border text-xs font-semibold ${T.navBtn}` }, '🚪 Salir')
            )
          ),

          // CALENDARIO
          React.createElement('div', { className: `${T.card} border rounded-xl p-4 mb-6` },
            React.createElement('div', { className: 'flex items-center justify-between mb-3' },
              React.createElement('button', { onClick: () => setSelectedDate(new Date(year, month - 1, 1)), className: `${T.muted}` }, '◀'),
              React.createElement('h3', { className: `font-bold capitalize ${T.heading}` }, new Date(year, month).toLocaleString('es-AR', { month: 'long', year: 'numeric' })),
              React.createElement('button', { onClick: () => setSelectedDate(new Date(year, month + 1, 1)), className: `${T.muted}` }, '▶')
            ),
            React.createElement('div', { className: 'grid grid-cols-7 gap-1 text-center text-xs' },
              ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(d => React.createElement('div', { key: d, className: `${T.faint} py-1` }, d)),
              calendarDays.map((day, idx) => {
                if (!day) return React.createElement('div', { key: idx });
                const curDate = new Date(year, month, day);
                const isSelected = getDateKey(curDate) === dateKey;
                return React.createElement('button', {
                  key: idx,
                  onClick: () => setSelectedDate(curDate),
                  className: `p-2 rounded border text-xs text-left h-14 ${isSelected ? 'border-blue-500 bg-blue-950 text-white' : T.cellEmpty}`
                }, day);
              })
            )
          ),

          // CABECERA DÍA
          React.createElement('div', { className: 'mb-6 flex justify-between items-center' },
            React.createElement('div', null,
              React.createElement('h1', { className: `text-4xl font-black ${T.heading}` }, selectedDate.getDate()),
              React.createElement('p', { className: `${T.muted} capitalize` }, selectedDate.toLocaleString('es-AR', { weekday: 'long', month: 'long' }))
            ),
            React.createElement('span', { className: 'text-2xl font-bold text-green-500' }, `${progressPercent}%`)
          ),

          // PRIORIDADES
          React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-3 mb-8' },
            dayData.priorities.map((p, idx) => React.createElement('div', { key: idx, className: 'bg-rose-700 border border-rose-500 rounded-lg p-3 text-white' },
              React.createElement('input', {
                type: 'text', value: p.text, onChange: (e) => updatePriorityText(idx, e.target.value),
                placeholder: `Prioridad 0${idx + 1}`,
                className: 'w-full bg-transparent font-bold placeholder-rose-200 focus:outline-none mb-2 text-sm'
              }),
              p.text && React.createElement('label', { className: 'text-xs flex items-center gap-2 cursor-pointer' },
                React.createElement('input', { type: 'checkbox', checked: p.done, onChange: () => togglePriorityDone(idx), className: 'accent-green-500' }),
                p.done ? 'Completada' : 'Marcar lista'
              )
            ))
          ),

          // TAREAS Y BLOQUES
          React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 mb-8' },
            CATEGORIES.map(cat => {
              const catTasks = dayData.tasks.filter(t => t.category === cat.id);
              const qa = quickAdd[cat.id];
              return React.createElement('div', { key: cat.id, className: `${cat.color} border ${cat.borderColor} rounded-xl p-4` },
                React.createElement('div', { className: 'flex justify-between items-center mb-3' },
                  React.createElement('h3', { className: `font-bold ${cat.textColor} text-sm uppercase` }, `${cat.icon} ${cat.label}`),
                  React.createElement('div', { className: 'flex gap-2 items-center bg-black/40 px-2 py-1 rounded text-xs text-green-400 font-mono' },
                    React.createElement('span', null, formatTime(getElapsedSeconds(cat.id))),
                    React.createElement('button', { onClick: () => getTimer(cat.id).running ? pauseTimer(cat.id) : startTimer(cat.id) }, getTimer(cat.id).running ? '⏸' : '▶'),
                    React.createElement('button', { onClick: () => resetTimer(cat.id) }, '⟲')
                  )
                ),
                React.createElement('div', { className: 'space-y-2 mb-3' },
                  catTasks.map(task => React.createElement('div', { key: task.id, className: 'bg-slate-800 border border-slate-700 rounded p-2 flex items-center justify-between text-xs gap-2' },
                    React.createElement('div', { className: 'flex items-center gap-2' },
                      React.createElement('input', { type: 'checkbox', checked: task.done, onChange: () => toggleTask(task.id), className: 'accent-green-500' }),
                      React.createElement('span', { className: task.done ? 'line-through text-slate-500' : 'text-white' }, task.text)
                    ),
                    React.createElement('button', { onClick: () => deleteTask(task.id), className: 'text-slate-500 hover:text-red-400' }, '✕')
                  ))
                ),
                React.createElement('div', { className: 'flex gap-1' },
                  React.createElement('input', {
                    type: 'text', value: qa.text, onChange: (e) => updateQuickAdd(cat.id, 'text', e.target.value),
                    onKeyPress: (e) => e.key === 'Enter' && addQuickTask(cat.id),
                    placeholder: '+ Agregar tarea...',
                    className: 'flex-1 px-2 py-1 bg-black/40 border border-slate-700 rounded text-xs text-white'
                  }),
                  React.createElement('button', { onClick: () => addQuickTask(cat.id), className: 'px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-white text-xs' }, '+')
                )
              );
            })
          ),

          // BLOC DE NOTAS
          React.createElement('div', { className: 'bg-amber-100 rounded-xl p-4 mb-8 text-slate-900 border border-amber-300' },
            React.createElement('h3', { className: 'font-bold text-amber-900 text-sm mb-2 uppercase' }, '📝 Notas'),
            React.createElement('div', { className: 'space-y-1 mb-3' },
              notes.map(n => React.createElement('div', { key: n.id, className: 'flex items-center gap-2 text-xs' },
                React.createElement('input', { type: 'checkbox', checked: n.done, onChange: () => toggleNote(n.id), className: 'accent-amber-600' }),
                React.createElement('input', {
                  type: 'text', value: n.text, onChange: (e) => updateNoteText(n.id, e.target.value),
                  className: `bg-transparent flex-1 focus:outline-none ${n.done ? 'line-through text-amber-700' : 'text-slate-900'}`
                }),
                React.createElement('button', { onClick: () => deleteNote(n.id), className: 'text-amber-700' }, '✕')
              ))
            ),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('input', {
                type: 'text', value: newNoteText, onChange: (e) => setNewNoteText(e.target.value),
                onKeyPress: (e) => e.key === 'Enter' && addNote(),
                placeholder: 'Escribir nota...',
                className: 'flex-1 px-3 py-2 bg-white/80 border border-amber-300 rounded text-xs'
              }),
              React.createElement('button', { onClick: addNote, className: 'px-4 py-2 bg-amber-600 text-white rounded text-xs font-bold' }, 'Guardar')
            )
          ),

          // PIE Y EXPORTACIÓN
          React.createElement('div', { className: 'flex gap-3' },
            React.createElement('button', { onClick: () => setSelectedDate(new Date()), className: `flex-1 py-3 rounded border text-sm font-bold ${T.navBtn}` }, 'Hoy'),
            React.createElement('button', { onClick: exportPDF, className: 'flex-1 py-3 bg-green-600 hover:bg-green-700 rounded text-sm font-bold text-white' }, 'Descargar PDF')
          )
        )
      );
    }

    ReactDOM.render(React.createElement(MiDia), document.getElementById('root'));
  </script>
</body>
</html>
